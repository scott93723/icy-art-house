<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICY Villa · 藝術家別墅</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0d0d0d;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: #f2f2f2;
    }
    #canvas { display: block; width: 100%; height: 100%; }
    #ui {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 34px;
    }
    #ui h1 {
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 200;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-shadow: 0 4px 30px rgba(0,0,0,0.6);
    }
    #ui h1 span {
      display: block;
      font-size: 0.32em;
      letter-spacing: 0.42em;
      color: #aaa;
      margin-top: 0.6em;
    }
    #ui .meta {
      font-size: 0.85rem;
      color: #999;
      letter-spacing: 0.08em;
      display: flex;
      gap: 28px;
      align-items: flex-end;
    }
    #ui .meta strong { color: #fff; font-weight: 400; }
    #loading {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      color: #888;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@200;400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="loading">正在載入 ICY 畫作…</div>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <div>
      <h1>ICY Villa<span>藝術家的自畫像別墅</span></h1>
    </div>
    <div class="meta">
      <div>作品數量<br><strong id="count">0</strong></div>
      <div>操作方式<br><strong>拖拽環繞 · 滾輪縮放 · 右鍵平移</strong></div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';

    const canvas = document.getElementById('canvas');
    const loading = document.getElementById('loading');
    const countEl = document.getElementById('count');

    // Scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);
    scene.fog = new THREE.FogExp2(0x111111, 0.035);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.65, 5.5);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;

    RectAreaLightUniformsLib.init();

    const controls = new OrbitControls(camera, canvas);
    controls.target.set(0, 1.4, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 1.85;
    controls.minDistance = 1.5;
    controls.maxDistance = 12;

    // Materials
    const wallMat = new THREE.MeshStandardMaterial({ color: 0xeae5d8, roughness: 0.9, metalness: 0 });
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x8a7f70, roughness: 0.6, metalness: 0.05 });
    const concreteMat = new THREE.MeshStandardMaterial({ color: 0x4a4a4a, roughness: 0.95 });
    const woodMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.7 });
    const glassMat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff, metalness: 0, roughness: 0.05, transmission: 0.92, thickness: 0.1, transparent: true
    });
    const frameMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.4 });
    const plaqueMat = new THREE.MeshStandardMaterial({ color: 0xf5f0e8, roughness: 0.8 });

    // Floor
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(16, 16), floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Ceiling
    const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(16, 16), wallMat);
    ceiling.rotation.x = Math.PI / 2;
    ceiling.position.y = 3.6;
    scene.add(ceiling);

    function makeWall(w, h, x, y, z, ry = 0) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.25), wallMat);
      mesh.position.set(x, y, z);
      mesh.rotation.y = ry;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    // Room shell
    makeWall(16, 3.6, 0, 1.8, -8);
    makeWall(16, 3.6, 0, 1.8, 8);
    makeWall(16, 3.6, -8, 1.8, 0, Math.PI/2);
    makeWall(16, 3.6, 8, 1.8, 0, Math.PI/2);

    // Front wall segments with opening
    makeWall(5, 3.6, -5.5, 1.8, 8);
    makeWall(5, 3.6, 5.5, 1.8, 8);
    makeWall(6, 1.2, 0, 3, 8);

    // Glass wall
    const glass = new THREE.Mesh(new THREE.PlaneGeometry(6, 2.4), glassMat);
    glass.position.set(0, 1.2, 8);
    scene.add(glass);

    // Concrete base
    const base = new THREE.Mesh(new THREE.BoxGeometry(16.4, 0.4, 16.4), concreteMat);
    base.position.y = 0.2;
    base.receiveShadow = true;
    scene.add(base);

    // Central wooden beam
    const beam = new THREE.Mesh(new THREE.BoxGeometry(0.3, 3.6, 0.3), woodMat);
    beam.position.set(0, 1.8, 0);
    beam.castShadow = true;
    scene.add(beam);

    // Artworks configuration
    const artworks = [
      { file: 'robot-cat-pink.jpg', title: '機器貓日常', year: '2014', x: -3, z: -7.8, ry: 0, baseW: 1.3 },
      { file: 'robot-cat-yellow.jpg', title: '機器貓日常', year: '2014', x: 0, z: -7.8, ry: 0, baseW: 1.3 },
      { file: 'robot-cat-gray.jpg', title: '機器貓日常', year: '2014', x: 3, z: -7.8, ry: 0, baseW: 1.3 },
      { file: 'guanyin-w01.jpg', title: '觀音系列 #w01', year: '2020', x: -7.8, z: -3, ry: Math.PI/2, baseW: 1.0 },
      { file: 'buddha-heart-sutra.jpg', title: '心經觀音', year: '2020', x: -7.8, z: 3, ry: Math.PI/2, baseW: 1.2 },
      { file: 'robot-cat-blue.jpg', title: '機器貓日常', year: '2014', x: 7.8, z: -3, ry: -Math.PI/2, baseW: 1.3 },
      { file: 'surreal-flower.jpg', title: '向日葵', year: '2014', x: 7.8, z: 3, ry: -Math.PI/2, baseW: 1.2 },
      { file: 'icy-portrait.jpg', title: 'ICY', year: 'Portrait', x: -5.5, z: 7.8, ry: Math.PI, baseW: 1.2 },
      { file: 'icy-studio.jpg', title: 'ICY Studio', year: 'Studio', x: 5.5, z: 7.8, ry: Math.PI, baseW: 1.2 },
    ];

    countEl.textContent = artworks.length;

    // Texture loader
    const loader = new THREE.TextureLoader();
    function loadTexture(url) {
      return new Promise((resolve, reject) => {
        loader.load(url, resolve, undefined, reject);
      });
    }

    // Caption plaque generator
    function makePlaque(title, year, width) {
      const cvs = document.createElement('canvas');
      const h = 128, w = 512;
      cvs.width = w; cvs.height = h;
      const ctx = cvs.getContext('2d');
      ctx.fillStyle = '#f5f0e8';
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#1a1a1a';
      ctx.font = '700 34px "Noto Sans TC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(title, w / 2, 56);
      ctx.font = '300 28px "Noto Sans TC", sans-serif';
      ctx.fillStyle = '#666';
      ctx.fillText(year, w / 2, 96);
      const tex = new THREE.CanvasTexture(cvs);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // Load and place all artworks
    async function initArtworks() {
      for (const art of artworks) {
        const tex = await loadTexture(`images/${art.file}`);
        tex.colorSpace = THREE.SRGBColorSpace;
        const aspect = tex.image.width / tex.image.height;

        const frameH = 1.7;
        const frameW = frameH * aspect;
        const clampedW = Math.min(frameW, art.baseW * 1.5);
        const clampedH = clampedW / aspect;

        const group = new THREE.Group();
        group.position.set(art.x, 1.9, art.z);
        group.rotation.y = art.ry;

        // Frame
        const frame = new THREE.Mesh(new THREE.BoxGeometry(clampedW + 0.12, clampedH + 0.12, 0.06), frameMat);
        frame.castShadow = true;
        group.add(frame);

        // Canvas
        const artMesh = new THREE.Mesh(
          new THREE.PlaneGeometry(clampedW, clampedH),
          new THREE.MeshStandardMaterial({ map: tex, roughness: 0.6 })
        );
        artMesh.position.z = 0.031;
        group.add(artMesh);

        // Plaque
        const plaqueW = clampedW;
        const plaqueH = plaqueW * (128 / 512);
        const plaqueTex = makePlaque(art.title, art.year, plaqueW);
        const plaque = new THREE.Mesh(
          new THREE.PlaneGeometry(plaqueW, plaqueH),
          new THREE.MeshStandardMaterial({ map: plaqueTex, roughness: 0.8 })
        );
        plaque.position.set(0, -clampedH / 2 - plaqueH / 2 - 0.1, 0.031);
        group.add(plaque);

        // Spotlight
        const spot = new THREE.SpotLight(0xfff5e6, 25, 6, Math.PI / 5, 0.4, 1);
        spot.position.set(0, 1.2, 1.4);
        spot.target = artMesh;
        spot.castShadow = true;
        group.add(spot);
        group.add(spot.target);

        scene.add(group);
      }

      loading.style.opacity = '0';
      setTimeout(() => loading.remove(), 500);
    }

    // Ambient lighting
    const ambient = new THREE.AmbientLight(0xffffff, 0.35);
    scene.add(ambient);

    // Directional sun
    const sun = new THREE.DirectionalLight(0xfff0dd, 1.2);
    sun.position.set(6, 8, 8);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 25;
    sun.shadow.camera.left = -10; sun.shadow.camera.right = 10;
    sun.shadow.camera.top = 10; sun.shadow.camera.bottom = -10;
    scene.add(sun);

    // Warm ceiling wash
    const rectLight = new THREE.RectAreaLight(0xffecd2, 2, 12, 12);
    rectLight.position.set(0, 3.5, 0);
    rectLight.rotation.x = -Math.PI / 2;
    scene.add(rectLight);

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    initArtworks().catch(err => {
      console.error(err);
      loading.textContent = '畫作載入失敗，請確認圖片路徑';
    });

    animate();
  </script>
</body>
</html>
